# Follow-up judge test cases.
#
# Question for each case: should Alex reply straight after the last human
# message? expect: "yes" or "no".
#
# Every case is the human message right after an Alex message, the one spot the
# cooldown (two human messages) would otherwise block. The messages are
# synthetic, written to match common shapes of group discussion in this task.
#
# Base rate: 19 "yes" of 116 (about 16%), so the judge should lean strongly
# toward "no". A missed "yes" only keeps the default pacing; a false "yes" makes
# Alex speak too often. Precision therefore matters more than recall. Targets:
# at most 5 false "yes" on verified negatives, and recall of at least 60%.
#
# Fields
#   named         : the last message names Alex. The rule-based address check
#                   already handles these, so the judge's own contribution is
#                   measured on named: false cases.
#   alex_answered : whether Alex in fact spoke next in that position. A "no"
#                   case with alex_answered: true is an unverified negative and
#                   is counted separately, not as a false positive.
# ---------------------------------------------------------------------

